name: Rebuild from DraconDex-APP

# Rebuilds both lanes against the current DraconDex-APP and opens a PR with the
# result. This is the "the app moved on, catch the PWA up" button.
#
# It needs one secret, because DraconDex-APP is a private repository:
#
#   APP_SOURCE_TOKEN — a token that can read ZYDRAXYL/DraconDex-APP
#
# Without it the checkout step fails immediately and says so, rather than
# building something stale. The same rebuild can always be done locally with
# `npm run build -- --local ../DraconDex-APP`, which needs no token at all.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'DraconDex-APP ref to build from'
        default: 'main'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the source token is present
        run: |
          if [ -z "${{ secrets.APP_SOURCE_TOKEN }}" ]; then
            echo "::error::APP_SOURCE_TOKEN is not set — this workflow cannot read the private DraconDex-APP repository."
            exit 1
          fi

      - name: Check out DraconDex-APP
        uses: actions/checkout@v5
        with:
          repository: ZYDRAXYL/DraconDex-APP
          ref: ${{ inputs.ref }}
          token: ${{ secrets.APP_SOURCE_TOKEN }}
          path: .app-checkout

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The mobile lane is the Flutter web target of the same lib/ that ships on
      # Android and iOS; the version here tracks DraconDex-APP's own web build.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install tooling
        run: npm install --no-audit --no-fund

      - name: Build both lanes
        run: npm run build -- --local .app-checkout

      - name: Install Chromium
        run: npx --yes playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium

      - name: Drive the rebuilt site
        run: npm run verify

      - name: Open a pull request with the rebuilt site
        uses: peter-evans/create-pull-request@v7
        with:
          branch: rebuild/app-${{ inputs.ref }}
          title: 'Rebuild the PWA from DraconDex-APP ${{ inputs.ref }}'
          body: |
            Rebuilt `dist/` from `ZYDRAXYL/DraconDex-APP@${{ inputs.ref }}`.

            Both lanes were driven in a real browser by `npm run verify` before
            this PR was opened — see the workflow run for the screenshots.
          commit-message: 'Rebuild the PWA from DraconDex-APP ${{ inputs.ref }}'
          add-paths: |
            dist
            app-source.json
          delete-branch: true
