name: Rebuild from the app repos

# Rebuilds every lane against the current app sources and opens a PR with the
# result. This is the "the apps moved on, catch the PWA up" button.
#
# Since the 2026-09-10 multi-repo split there are TWO sources, not one:
#   ZYDRAXYL/DraconDex-EXE  the Electron front-end  -> the /d/ lane
#   ZYDRAXYL/DraconDex-APK  the Flutter front-end   -> the /m/ and /t/ lanes
# Both are private, so both need a readable token:
#
#   APP_SOURCE_TOKEN — a token that can read BOTH repositories
#
# Without it the checkout fails immediately and says so, rather than building
# something stale. The same rebuild can always be done locally against a
# checkout with `npm run build -- --local <dir>`, which needs no token at all.
#
# Note the lanes are not independent: /t/ is the same Flutter build as /m/,
# served through one small HTML file, so an APK refresh moves both.

on:
  workflow_dispatch:
    inputs:
      exe_ref:
        description: 'DraconDex-EXE ref to build from'
        default: 'main'
        required: false
      apk_ref:
        description: 'DraconDex-APK ref to build from'
        default: 'main'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the source token is present
        run: |
          if [ -z "${{ secrets.APP_SOURCE_TOKEN }}" ]; then
            echo "::error::APP_SOURCE_TOKEN is not set — this workflow cannot read the private DraconDex-EXE and DraconDex-APK repositories. Create a token that can read both and save it as the APP_SOURCE_TOKEN secret, then re-run."
            exit 1
          fi

      # Both repos are assembled into ONE .app-checkout tree, because that is
      # the shape fetch-app.mjs --local expects and the shape every build tool
      # and all 13 shim/*.js files were written against. EXE contributes
      # electron/ + src/ + package.json; APK contributes flutter/.
      - name: Check out DraconDex-EXE
        uses: actions/checkout@v5
        with:
          repository: ZYDRAXYL/DraconDex-EXE
          ref: ${{ inputs.exe_ref }}
          token: ${{ secrets.APP_SOURCE_TOKEN }}
          path: .app-checkout

      - name: Check out DraconDex-APK
        uses: actions/checkout@v5
        with:
          repository: ZYDRAXYL/DraconDex-APK
          ref: ${{ inputs.apk_ref }}
          token: ${{ secrets.APP_SOURCE_TOKEN }}
          path: .apk-checkout

      - name: Assemble the source tree
        run: |
          rm -rf .app-checkout/flutter
          mv .apk-checkout/flutter .app-checkout/flutter
          test -f .app-checkout/electron/main.js || { echo "::error::DraconDex-EXE checkout has no electron/main.js"; exit 1; }
          test -f .app-checkout/flutter/pubspec.yaml || { echo "::error::DraconDex-APK checkout has no flutter/pubspec.yaml"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The mobile lane is the Flutter web target of the same lib/ that ships on
      # Android and iOS; the version here tracks DraconDex-EXE's own web build.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install tooling
        run: npm install --no-audit --no-fund

      - name: Build both lanes
        run: npm run build -- --local .app-checkout

      - name: Install Chromium
        run: npx --yes playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium

      - name: Drive the rebuilt site
        run: npm run verify

      - name: Open a pull request with the rebuilt site
        uses: peter-evans/create-pull-request@v7
        with:
          branch: rebuild/app-${{ inputs.exe_ref }}-${{ inputs.apk_ref }}
          title: 'Rebuild the PWA from EXE ${{ inputs.exe_ref }} / APK ${{ inputs.apk_ref }}'
          body: |
            Rebuilt `dist/` from:

            - `ZYDRAXYL/DraconDex-EXE@${{ inputs.exe_ref }}` — the `/d/` desktop lane
            - `ZYDRAXYL/DraconDex-APK@${{ inputs.apk_ref }}` — the `/m/` phone and `/t/` tablet lanes

            All three lanes were driven in a real browser by `npm run verify`
            before this PR was opened — see the workflow run for the screenshots.
          commit-message: 'Rebuild the PWA from EXE ${{ inputs.exe_ref }} / APK ${{ inputs.apk_ref }}'
          add-paths: |
            dist
            app-source.json
          delete-branch: true
